name: Flutter CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Generate, analyze, and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pin the SDK so CI generates byte-identical .g.dart output to the
          # committed files (Dart 3.11.5). Newer stable SDKs (Dart 3.12+)
          # emit different codegen output and break the freshness check.
          flutter-version: 3.41.9
          cache: true

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Flutter pub get
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check generated sources are current
        run: git diff --exit-code

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee /tmp/analyze.log
          exit $?

      - name: Upload analyze log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: analyze-log
          path: /tmp/analyze.log
          if-no-files-found: ignore

      - name: Test
        run: flutter test
