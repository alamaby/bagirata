name: Maestro Android E2E

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maestro-android
  cancel-in-progress: true

jobs:
  maestro:
    name: Run Maestro flows
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0"
          channel: stable
          cache: true

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Flutter pub get
        run: flutter pub get

      - name: Run build_runner
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run Maestro on Android emulator
        id: maestro
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            mkdir -p maestro-results
            adb logcat -c
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            set +e
            maestro test .maestro --format junit --output maestro-results/results.xml
            status=$?
            adb logcat -d > maestro-results/logcat.txt
            exit $status

      - name: Upload Maestro failure artifacts
        if: steps.maestro.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: maestro-failure-${{ github.run_id }}
          path: |
            maestro-results/
            build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: warn
