appId: com.alamaby.bagistruk
name: Theme preference
tags:
  - smoke
  - manual
  - mutates-preferences
---
# Preconditions: Settings reachable. Visual theme needs human confirmation;
# this smoke only checks selector remains usable after choosing dark mode.
- launchApp:
    clearState: false
- tapOn: "Pengaturan|Settings"
- extendedWaitUntil:
    visible: "Profil & Pengaturan|Profile & Settings"
    timeout: 15000
- tapOn: "Tema|Theme"
- tapOn: "Gelap|Dark"
- assertVisible: "Profil & Pengaturan|Profile & Settings"
