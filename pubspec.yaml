name: bagistruk
description: "BagiStruk — split-bill app with multi-photo OCR via Supabase Edge Functions."
publish_to: 'none'
version: 0.32.4+84

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management (code-generated). Pinned to the 3.x/4.x line — the 2.x
  # generator transitively depends on analyzer_plugin 0.12.0 which doesn't
  # compile against analyzer 7.x (Element2 migration).
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Navigation
  go_router: ^14.6.2

  # Responsiveness
  flutter_screenutil: ^5.9.3

  # Backend
  google_sign_in: ^7.2.0
  google_mobile_ads: ^8.0.0
  in_app_purchase: ^3.2.0
  supabase_flutter: ^2.8.1

  # OCR pipeline support
  image_picker: ^1.1.2
  image: ^4.3.0
  # Android share target ("Scan receipt" activity-alias): receives images
  # shared from other apps (SEND / SEND_MULTIPLE) into the scan draft.
  # Wrapped in ISharedMediaService so it can be mocked / swapped later.
  receive_sharing_intent: ^1.9.0
  # Device fingerprint signals for the anti-abuse gate. Read-only access
  # to non-PII hardware fields (Android version, SDK, brand, model,
  # hardware) — no IMEI, Android ID, serial, MAC, or advertising ID.
  # Values are HMAC-hashed at the Edge Function and never persisted raw.
  device_info_plus: ^11.0.0

  # Animations / motion
  lottie: ^3.1.2
  flutter_animate: ^4.5.0

  # Misc
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2
  uuid: ^4.5.1
  logger: ^2.5.0
  share_plus: ^10.1.4
  pdf: ^3.12.0
  # M2/F7 XLSX export (Plus). Pure-Dart workbook writer, sejajar dengan
  # `pdf:` untuk export client-side. Angka ditulis sebagai sel numerik agar
  # parity dengan CSV (raw double) terjaga; format tampilan ikut Excel.
  excel: ^4.0.6
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  # SHA-256 hashing for marketing_subscribers.email_canonical_hash so the
  # in-app dual-write can identify the same row across devices without
  # leaking the plaintext email. Matches the server-side
  # public.canonical_email_hash() in migration 20260608130000.
  crypto: ^3.0.6
  flutter_markdown_plus: ^1.0.7
  # Deep link handling for email confirmation / password-reset callbacks.
  # Receives initial and incoming `bagistruk://` URIs so the auth layer can
  # call `getSessionFromUrl()` even when the app was cold-started by the link.
  app_links: ^6.2.0
  # Native contact picker for the participant import flow. Opens the
  # OS-native picker via Intent — no READ_CONTACTS permission required.
  # Returns only the user-selected contact's name and phone number.
  flutter_native_contact_picker: ^0.0.12
  # Local settlement reminders (M1/F4). Best-effort OS notifications at T+3/T+7
  # days for unsettled bills; all scheduling bookkeeping lives in
  # SettlementReminderService so a denied permission or missing plugin never
  # crashes the app. `timezone` backs zoned scheduling.
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  # Local JSON cache for the cross-bill participant suggestion library. Stores
  # the top-N suggestions returned by `list_suggested_participants` so the
  # split screen can render suggestions instantly before the network round
  # trip completes. Already a transitive dep via supabase_flutter, pinned
  # explicitly so the import works without relying on the transitive version.
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  riverpod_generator: ^3.0.0
  mockito: ^5.4.4
  build_test: ^3.5.14
  # custom_lint / riverpod_lint are intentionally omitted: their transitive
  # analyzer_plugin 0.12.0 does not yet support analyzer 7.x (Element2 migration).
  # Re-add once the ecosystem catches up — they're IDE-only and not needed for
  # code generation or `flutter analyze`.

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/lottie/
    - assets/images/
    - assets/images/onboarding/
    - docs/privacy-policy.md
    - docs/terms-of-service.md

# Run `dart run flutter_launcher_icons` after editing this block.
# `image_path` is the legacy square icon (used on pre-Android 8 devices).
# `adaptive_icon_foreground` should be a 1024×1024 PNG with transparent
# padding so the system's circular/squircle mask doesn't clip the artwork —
# replace assets/images/icon_launcher.png with a properly padded version
# before the first Play Store upload (current asset is reused as a placeholder).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon_launcher.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/icon_launcher.png"
  min_sdk_android: 21
